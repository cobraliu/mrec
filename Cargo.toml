[package]
name = "mrec"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cobraliu/mrec"
description = "Cross-platform mouse & keyboard macro recorder/replayer (rdev). Works on Windows, macOS and Linux/X11 — not Wayland."

[dependencies]
rdev = { version = "0.5", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
